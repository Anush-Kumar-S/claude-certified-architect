const DOMC={0:'var(--d0)',1:'var(--d1)',2:'var(--d2)',3:'var(--d3)',4:'var(--d4)',5:'var(--d5)'};
const DOMNAME={1:'Agentic Architecture & Orchestration',2:'Tool Design & MCP Integration',3:'Claude Code Configuration & Workflows',4:'Prompt Engineering & Structured Output',5:'Context Management & Reliability'};
const DOMWT={1:'27%',2:'18%',3:'20%',4:'20%',5:'15%'};

/* ---------------- LESSONS ---------------- */
const LESSONS=[
{dom:1,title:'The agentic loop',body:`
<p>This is the single most-tested mechanic, so it's worth getting really comfortable. A simple Claude call is one round trip: you ask, it answers. An <b>agent</b> is different — it can use <b>tools</b> (look up an order, search the web, run code) across several steps. The "agentic loop" is the repeating cycle that makes that possible.</p>
<h4>The cycle, in plain terms</h4>
<p>You send Claude a request plus a list of allowed tools. Claude decides: can I answer now, or do I need a tool first? If it needs a tool, it doesn't run it itself — it <i>asks your code</i> to run it. Your code runs the tool, gets the result, hands it back. Claude now has new info and decides again: done, or another tool? This repeats until Claude gives a final answer.</p>
<p>Think of a chef (Claude) and a kitchen assistant (your code). The chef decides "fetch the customer's order"; the assistant walks to the back, grabs it, reports back; the chef looks and decides the next step. The chef makes decisions; the assistant fetches.</p>
<h4>The key signal: stop_reason</h4>
<p>Every Claude response includes <code>stop_reason</code>, telling your code <i>why it stopped</i>. Two values matter:</p>
<ul>
<li><code>stop_reason: "tool_use"</code> → Claude wants a tool run. Run it, append the result to the conversation, loop again.</li>
<li><code>stop_reason: "end_turn"</code> → Claude is finished. Stop the loop.</li>
</ul>
<p>After each tool runs, you <b>append its result to the conversation history</b> before the next request — that's how Claude "remembers" what it learned. And crucially, Claude itself chooses which tool to call next based on context (<b>model-driven</b>); it is not a hardcoded flowchart you scripted in advance.</p>
<div class="callout trap"><b>Three anti-patterns the exam will tempt you with:</b> (1) reading Claude's text to guess if it's done; (2) using an arbitrary iteration cap as your main stop; (3) treating "Claude wrote some text" as completion. All three invent a fake signal instead of trusting <code>stop_reason</code>.</div>
<div class="callout check"><b>Self-check:</b> if a response has <code>stop_reason: "tool_use"</code>, what two things must your code do next? (Run the requested tool, then append its result to the conversation.)</div>
`},

{dom:1,title:'Coordinating multiple agents',body:`
<p>For big jobs, one agent isn't enough. A common design is the <b>coordinator–subagent</b> pattern, also called <b>hub-and-spoke</b>. One "coordinator" agent is the hub; specialized "subagents" are the spokes (one searches the web, one analyzes documents, one synthesizes, one writes the report).</p>
<h4>What the coordinator owns</h4>
<p>The coordinator manages <i>all</i> communication between subagents, handles their errors, routes information, breaks the big task into pieces, decides which subagents to call, and combines their results at the end. Subagents don't talk to each other directly — everything flows through the hub. That gives you one place to observe and control the whole system.</p>
<div class="callout"><b>Important:</b> subagents work in <b>isolated context</b>. They do <i>not</i> automatically inherit the coordinator's conversation history. Whatever a subagent needs to know, the coordinator must hand it explicitly.</div>
<h4>The classic failure</h4>
<p>The biggest risk is <b>too-narrow decomposition</b>. If the coordinator breaks "AI in creative industries" into only "digital art," "graphic design," and "photography," the subagents will each do their job perfectly — and the final report still misses music, writing, and film. The subagents aren't broken; the <i>assignment</i> was incomplete.</p>
<div class="callout check"><b>Self-check:</b> a research report comes back missing whole subtopics, but every subagent's logs look successful. Where do you look first? (The coordinator's task decomposition.)</div>
`},

{dom:1,title:'Spawning subagents and passing context',body:`
<p>How does a coordinator actually launch a subagent? Through the <b>Task tool</b>. For a coordinator to invoke subagents, its <code>allowedTools</code> list <b>must include <code>"Task"</code></b> — forget that and it simply can't delegate.</p>
<h4>Context does not travel for free</h4>
<p>Because subagents have isolated context, you must <b>put everything they need directly in their prompt</b>. For example, if a synthesis subagent needs the web-search findings, the coordinator copies those findings into the synthesis subagent's prompt. There's no shared memory between invocations.</p>
<p>Each subagent type is defined by an <code>AgentDefinition</code>: its description, its system prompt, and which tools it's restricted to.</p>
<h4>Running subagents in parallel</h4>
<p>To run several subagents at once, the coordinator emits <b>multiple <code>Task</code> calls in a single response</b> — not one per turn. That's what gives you real parallelism and lower latency.</p>
<div class="callout"><b>Good practice:</b> when passing data between agents, keep content separate from metadata (source URLs, document names, page numbers) using a structured format, so attribution isn't lost. And write coordinator prompts that state <i>goals and quality criteria</i> rather than rigid step-by-step instructions — that lets subagents adapt.</div>
<div class="callout check"><b>Self-check:</b> your coordinator "can't seem to delegate." What's the first config to check? (Whether <code>allowedTools</code> includes <code>"Task"</code>.)</div>
`},

{dom:1,title:'Enforcement vs. guidance (when prompts aren’t enough)',body:`
<p>Suppose a rule must <i>always</i> hold: "verify the customer's identity before processing any refund." You have two ways to make that happen.</p>
<ul>
<li><b>Prompt-based guidance</b>: write "always verify identity first" in the system prompt. The model usually obeys — but "usually" means a non-zero failure rate.</li>
<li><b>Programmatic enforcement</b>: use code (a <b>hook</b> or a <b>prerequisite gate</b>) that physically blocks the refund tool until verification has happened. This is <i>deterministic</i> — it cannot be skipped.</li>
</ul>
<div class="callout trap"><b>Key exam idea:</b> when a mistake has real consequences (money, security, compliance), prompt instructions alone are not good enough. Use programmatic enforcement for guaranteed compliance. Prompts are fine for soft preferences.</div>
<p>A concrete pattern: block <code>process_refund</code> until <code>get_customer</code> has returned a verified customer ID. The gate makes the ordering impossible to get wrong, no matter how the model is feeling that day.</p>
<p>Enforcement also helps with <b>handoffs</b>: when escalating to a human who can't see the conversation, compile a structured summary (customer ID, root cause, refund amount, recommended action) so the human has everything.</p>
<div class="callout check"><b>Self-check:</b> the exam describes refunds occasionally going out without ID checks despite a clear prompt rule. Best fix? (A programmatic prerequisite/gate, not a stronger prompt.)</div>
`},

{dom:1,title:'Agent SDK hooks',body:`
<p>A <b>hook</b> is code that runs automatically at a specific moment in the agent's lifecycle, letting you intercept what's happening. Two flavors matter for the exam.</p>
<h4>1. PostToolUse hooks — fix the data coming back</h4>
<p>These intercept a tool's <i>result</i> before Claude sees it, so you can transform or normalize it. Classic use: different backend tools return timestamps in different formats (Unix seconds, ISO 8601, etc.). A <code>PostToolUse</code> hook can normalize them all into one format so the agent reasons over clean, consistent data.</p>
<h4>2. Tool-call interception hooks — block the action going out</h4>
<p>These intercept an <i>outgoing</i> tool call to enforce a rule. Example: block any <code>process_refund</code> over $500 and redirect to a human-escalation workflow. The model proposed the action; the hook vetoes it.</p>
<div class="callout trap"><b>The distinction to remember:</b> PostToolUse acts on <i>results coming in</i>; interception acts on <i>calls going out</i>. And like the previous lesson — hooks give <i>deterministic</i> guarantees, while prompts give only <i>probabilistic</i> compliance. Choose hooks when business rules must always hold.</div>
<div class="callout check"><b>Self-check:</b> you need to guarantee no refund over a threshold ever executes. Prompt or hook? (Hook — a tool-call interception hook.)</div>
`},

{dom:1,title:'Breaking big tasks into steps',body:`
<p><b>Task decomposition</b> is how you split a complex job. Two main styles, and knowing when to use each is the point.</p>
<ul>
<li><b>Prompt chaining (fixed sequential)</b>: you predefine the steps. Good when the workflow is <i>predictable</i> — e.g., a code review that always does "analyze each file, then run a cross-file pass."</li>
<li><b>Dynamic decomposition</b>: the agent generates subtasks based on what it discovers as it goes. Good for <i>open-ended</i> investigation — e.g., "add comprehensive tests to this legacy codebase," where you first map the structure, then adapt as dependencies surface.</li>
</ul>
<h4>A concrete pattern: splitting reviews</h4>
<p>For a large multi-file code review, don't analyze everything at once. Do a <b>per-file local pass</b> (catch issues inside each file) plus a separate <b>cross-file integration pass</b> (catch issues that span files). This avoids "attention dilution," where looking at too much at once makes the model shallow and inconsistent.</p>
<div class="callout check"><b>Self-check:</b> predictable, repeatable multi-aspect work → which style? (Prompt chaining.) Murky, exploratory work → which? (Dynamic decomposition.)</div>
`},

{dom:1,title:'Sessions: resuming and forking',body:`
<p>Long pieces of work span multiple sittings. Claude Code gives you ways to manage that conversation state.</p>
<ul>
<li><b><code>--resume &lt;session-name&gt;</code></b>: continue a specific named conversation you started earlier.</li>
<li><b><code>fork_session</code></b>: branch off from a shared baseline to explore two different approaches independently — like comparing two refactoring strategies from the same starting analysis.</li>
</ul>
<h4>Resume vs. start fresh</h4>
<p>Resuming is great <i>when the prior context is still mostly valid</i>. But if you've changed files since, the agent's old tool results are now <b>stale</b>. In that case, starting a <b>new session with a clean structured summary</b> is more reliable than resuming with outdated data.</p>
<div class="callout"><b>Nuance:</b> if you do resume after editing files, tell the agent exactly which files changed so it can re-analyze just those, instead of re-exploring everything.</div>
<div class="callout check"><b>Self-check:</b> you resume a session but the codebase changed a lot since. Safer move? (Start fresh and inject a summary — stale tool results mislead.)</div>
`},

{dom:2,title:'Writing tool descriptions',body:`
<p>When Claude has several tools, how does it pick one? Almost entirely from the <b>tool description</b>. The description is the primary mechanism for tool selection — so a vague description is a reliability bug.</p>
<h4>What goes wrong</h4>
<p>If two tools have thin, similar descriptions — <code>analyze_content</code> ("Retrieves content") vs <code>analyze_document</code> ("Analyzes a document") — Claude can't tell them apart and misroutes. The fix is to write descriptions that clearly state each tool's purpose, expected inputs, example queries, edge cases, and <i>when to use it versus a similar tool</i>.</p>
<h4>Two repair moves</h4>
<ul>
<li><b>Rename + re-describe</b> to remove overlap: <code>analyze_content</code> → <code>extract_web_results</code> with a web-specific description.</li>
<li><b>Split</b> a generic tool into purpose-specific ones with clear input/output contracts: split <code>analyze_document</code> into <code>extract_data_points</code>, <code>summarize_content</code>, and <code>verify_claim_against_source</code>.</li>
</ul>
<div class="callout trap"><b>Watch out:</b> a keyword-heavy system prompt can override even a well-written description and create unintended tool associations. If selection is off, review the prompt too.</div>
<div class="callout check"><b>Self-check:</b> two similar tools, both with minimal descriptions, are getting confused. Cheapest effective first step? (Expand the descriptions — inputs, examples, boundaries.)</div>
`},

{dom:2,title:'Structured error responses for tools',body:`
<p>When a tool fails, <i>how</i> it reports the failure decides whether the agent can recover smartly. MCP tools use an <code>isError</code> flag to signal failure — but a bare "Operation failed" is almost useless.</p>
<h4>Categorize the error</h4>
<p>Different failures need different responses, so return a category:</p>
<ul>
<li><b>Transient</b> — timeouts, service temporarily down. Worth a retry.</li>
<li><b>Validation</b> — bad input. Retrying the same thing won't help.</li>
<li><b>Business</b> — a policy violation (e.g., refund too large). Explain it to the customer.</li>
<li><b>Permission</b> — not allowed.</li>
</ul>
<p>Good errors include <code>errorCategory</code>, an <code>isRetryable</code> boolean, and a human-readable message. That lets the agent retry the right things and stop wasting attempts on the wrong ones.</p>
<div class="callout trap"><b>Subtle but tested:</b> an <i>access failure</i> (couldn't reach the data) is different from a <i>valid empty result</i> (query worked, nothing matched). Don't report "no results" as success when the search actually broke — and don't treat a legitimate empty result as an error.</div>
<div class="callout check"><b>Self-check:</b> a subagent hits a transient timeout. What should it do locally before bothering the coordinator? (Try local recovery/retry; only propagate errors it can't resolve, with partial results + what it attempted.)</div>
`},

{dom:2,title:'Distributing tools and tool_choice',body:`
<p>More tools is not better. Giving an agent <b>too many tools</b> (say 18 instead of 4–5) actually <i>degrades</i> reliability, because every extra option makes the selection decision harder.</p>
<h4>Scope tools to the role</h4>
<p>Give each agent only the tools its job needs. A synthesis agent shouldn't have web-search tools it might misuse. For occasional cross-role needs, give a narrow, scoped tool (e.g., a single <code>verify_fact</code> for the synthesis agent) and route anything complex back through the coordinator.</p>
<h4>The tool_choice setting</h4>
<p>You can control whether and how Claude calls a tool:</p>
<ul>
<li><code>"auto"</code> — Claude may call a tool <i>or</i> just return text.</li>
<li><code>"any"</code> — Claude <i>must</i> call some tool, but picks which. Use this to guarantee a tool call instead of conversational text.</li>
<li><b>Forced</b> <code>{"type":"tool","name":"extract_metadata"}</code> — Claude must call that <i>specific</i> tool. Use it to force a step to run first (e.g., extract metadata before enrichment).</li>
</ul>
<div class="callout check"><b>Self-check:</b> you need a guaranteed structured tool call (no chit-chat) but don't care which extraction tool runs. Which setting? (<code>"any"</code>.)</div>
`},

{dom:2,title:'Connecting MCP servers',body:`
<p><b>MCP (Model Context Protocol)</b> is how Claude connects to outside systems. You register <b>MCP servers</b>, and all their tools become available to the agent at connection time. Where you register them matters.</p>
<ul>
<li><b>Project scope — <code>.mcp.json</code></b>: shared team tooling, checked into version control so everyone gets it.</li>
<li><b>User scope — <code>~/.claude.json</code></b>: your personal or experimental servers, not shared with teammates.</li>
</ul>
<h4>Secrets without committing secrets</h4>
<p>Use environment-variable expansion in <code>.mcp.json</code>, e.g. <code>\${GITHUB_TOKEN}</code>, so credentials are pulled from the environment rather than hardcoded into a file you commit.</p>
<h4>MCP resources</h4>
<p>Besides tools (which <i>do</i> things), MCP also offers <b>resources</b> — a way to expose content catalogs (issue summaries, doc hierarchies, database schemas) so the agent can <i>see</i> what's available without burning tool calls on exploration.</p>
<div class="callout"><b>Practical tip:</b> prefer existing community MCP servers for standard integrations (e.g., Jira); reserve custom servers for team-specific workflows. And write detailed MCP tool descriptions, or the agent may fall back to weaker built-in tools like Grep.</div>
<div class="callout check"><b>Self-check:</b> a tool should be shared with the whole team via the repo. Which file? (<code>.mcp.json</code>, project scope.)</div>
`},

{dom:2,title:'The built-in tools',body:`
<p>Claude Code ships with built-in tools. Knowing which to reach for is tested directly.</p>
<ul>
<li><b>Grep</b> — search file <i>contents</i> for a pattern (function names, error messages, import statements). Use it to find all callers of a function.</li>
<li><b>Glob</b> — match file <i>paths/names</i> by pattern, e.g. <code>**/*.test.tsx</code> to find all test files.</li>
<li><b>Read / Write</b> — full-file operations.</li>
<li><b>Edit</b> — targeted change using a unique piece of matching text. If that text isn't unique, Edit fails — then fall back to <b>Read + Write</b> for a reliable change.</li>
<li><b>Bash</b> — run shell commands.</li>
</ul>
<div class="callout"><b>The mental model:</b> Grep is for "what's <i>in</i> the files," Glob is for "which files exist by name." Build understanding incrementally — start with Grep to find entry points, then Read to follow imports — rather than reading everything up front.</div>
<div class="callout check"><b>Self-check:</b> Edit keeps failing because your anchor text appears in several places. What's the reliable fallback? (Read the file, then Write it back with the change.)</div>
`},

{dom:3,title:'The CLAUDE.md hierarchy',body:`
<p><code>CLAUDE.md</code> is how you give Claude Code standing instructions and project context. There are three levels, and they stack:</p>
<ul>
<li><b>User level</b> — <code>~/.claude/CLAUDE.md</code>. Applies only to <i>you</i>; <b>not</b> shared with teammates via version control.</li>
<li><b>Project level</b> — <code>.claude/CLAUDE.md</code> or a root <code>CLAUDE.md</code>. Shared with the team through the repo.</li>
<li><b>Directory level</b> — a <code>CLAUDE.md</code> in a subdirectory, for rules specific to that folder.</li>
</ul>
<div class="callout trap"><b>Classic diagnostic question:</b> a new teammate isn't getting the standards everyone else has. Likely cause? Those instructions live in someone's <i>user-level</i> file, not the shared <i>project-level</i> one.</div>
<h4>Keeping it tidy</h4>
<p>Use <code>@import</code> to pull in external files so CLAUDE.md stays modular. For bigger setups, split rules into a <code>.claude/rules/</code> directory with topic files like <code>testing.md</code>, <code>api-conventions.md</code>, <code>deployment.md</code>, instead of one giant file. Use the <code>/memory</code> command to see which memory files are actually loaded when behavior seems inconsistent.</p>
<div class="callout check"><b>Self-check:</b> you want a coding standard every developer gets automatically on clone. Which level? (Project level.)</div>
`},

{dom:3,title:'Custom slash commands and skills',body:`
<p>Two ways to package reusable behavior in Claude Code: <b>slash commands</b> and <b>skills</b>.</p>
<h4>Slash commands</h4>
<p>A <code>/review</code> command, for example. Where it lives controls who gets it:</p>
<ul>
<li><b>Project</b> — <code>.claude/commands/</code>, shared via version control (everyone gets it on clone/pull).</li>
<li><b>User</b> — <code>~/.claude/commands/</code>, personal only.</li>
</ul>
<h4>Skills</h4>
<p>Skills live in <code>.claude/skills/</code> as <code>SKILL.md</code> files with useful frontmatter options:</p>
<ul>
<li><b><code>context: fork</code></b> — run the skill in an isolated sub-agent context so its (often verbose) output doesn't pollute your main conversation. Great for codebase analysis or brainstorming.</li>
<li><b><code>allowed-tools</code></b> — restrict which tools the skill may use (e.g., limit to file writes to prevent destructive actions).</li>
<li><b><code>argument-hint</code></b> — prompt the developer for required parameters if they invoke the skill without them.</li>
</ul>
<div class="callout"><b>Skill vs CLAUDE.md:</b> a skill is <i>on-demand</i>, invoked for a specific task. CLAUDE.md is <i>always loaded</i> — use it for universal standards.</div>
<div class="callout check"><b>Self-check:</b> a skill produces huge output you don't want cluttering the chat. Which frontmatter? (<code>context: fork</code>.)</div>
`},

{dom:3,title:'Path-specific rules',body:`
<p>Sometimes a convention should apply to files <i>by type, wherever they live</i>. Test files, for instance, are scattered all over a codebase (<code>Button.test.tsx</code> sits next to <code>Button.tsx</code>). A directory-level CLAUDE.md can't cover them well because it's tied to one folder.</p>
<h4>The tool for the job</h4>
<p>Create files in <code>.claude/rules/</code> with YAML frontmatter containing a <code>paths</code> field of glob patterns. The rule then loads <i>only</i> when you're editing a matching file. Example: <code>paths: ["**/*.test.tsx"]</code> applies your testing conventions to every test file no matter where it is. Or <code>paths: ["terraform/**/*"]</code> for infra files.</p>
<div class="callout"><b>Why this is better here:</b> it loads conventions conditionally (less irrelevant context and fewer tokens), and it follows files by pattern across the whole tree — something directory-bound CLAUDE.md files can't do.</div>
<div class="callout check"><b>Self-check:</b> you want one set of test conventions applied to all <code>*.test.tsx</code> files everywhere. Best mechanism? (A <code>.claude/rules/</code> file with a glob in its <code>paths</code> frontmatter.)</div>
`},

{dom:3,title:'Plan mode vs. direct execution',body:`
<p>Claude Code can either <b>plan first</b> or <b>execute directly</b>. Picking the right one is a frequent exam question.</p>
<ul>
<li><b>Plan mode</b> — for complex tasks: large-scale changes, multiple valid approaches, architectural decisions, many files. It lets Claude safely explore and design <i>before</i> touching code, preventing costly rework.</li>
<li><b>Direct execution</b> — for simple, well-scoped changes: a single bug fix with a clear stack trace, adding one validation check.</li>
</ul>
<div class="callout trap"><b>The trap:</b> "start direct and switch to plan mode only if it gets complicated." If the complexity is <i>already stated</i> in the requirements (e.g., "restructure this monolith into microservices across dozens of files"), choose plan mode <i>up front</i>. The complexity isn't going to emerge — it's already there.</div>
<p>You can also combine them: plan the investigation, then directly execute the planned approach. And the <b>Explore subagent</b> isolates verbose discovery output so it doesn't exhaust your main context during multi-phase work.</p>
<div class="callout check"><b>Self-check:</b> "migrate a library affecting 45+ files, choosing between two integration approaches." Plan or direct? (Plan mode — architectural, multi-file, multiple approaches.)</div>
`},

{dom:3,title:'Iterative refinement techniques',body:`
<p>When a prompt gives inconsistent results, several techniques reliably improve things. The exam expects you to pick the proportionate one.</p>
<ul>
<li><b>Concrete input/output examples</b> — the most effective way to communicate an expected transformation when prose descriptions are read inconsistently. Provide 2–3.</li>
<li><b>Test-driven iteration</b> — write the test suite first (expected behavior, edge cases, performance), then iterate by sharing the test failures to guide Claude toward a fix.</li>
<li><b>The interview pattern</b> — have Claude ask <i>you</i> clarifying questions before implementing, surfacing considerations (cache invalidation, failure modes) you hadn't thought of. Especially useful in unfamiliar domains.</li>
</ul>
<div class="callout"><b>One vs. many messages:</b> if several issues <i>interact</i>, fix them together in one detailed message. If they're <i>independent</i>, fix them sequentially.</div>
<div class="callout check"><b>Self-check:</b> a prose description keeps producing the wrong transformation. Fastest clarifier? (Give 2–3 concrete input/output examples.)</div>
`},

{dom:3,title:'Putting Claude Code in CI/CD',body:`
<p>To run Claude Code inside an automated pipeline (code review, test generation, PR feedback), you need it to run <i>without</i> waiting for a human.</p>
<ul>
<li><b><code>-p</code> / <code>--print</code></b> — non-interactive mode. It processes the prompt, prints the result, and exits. Without it, the job hangs waiting for interactive input. This is <i>the</i> fix for "my CI job hangs."</li>
<li><b><code>--output-format json</code> + <code>--json-schema</code></b> — produce machine-parseable structured output you can post as inline PR comments.</li>
</ul>
<div class="callout"><b>CLAUDE.md in CI:</b> it carries your testing standards, fixtures, and review criteria into the pipeline-invoked Claude, improving output quality and cutting low-value findings.</div>
<div class="callout trap"><b>Subtle one:</b> the same session that <i>generated</i> code is worse at reviewing it — it keeps its own reasoning and won't question itself. Use a separate, independent instance for review. Also feed prior review findings back in so re-runs report only new/unaddressed issues (no duplicate comments).</div>
<div class="callout check"><b>Self-check:</b> CI job hangs on <code>claude "review this PR"</code>. Fix? (Add the <code>-p</code> flag.)</div>
`},

{dom:4,title:'Explicit criteria beat vague instructions',body:`
<p>Telling Claude to "be conservative" or "only report high-confidence findings" sounds reasonable but doesn't actually improve precision. Vague, confidence-based instructions don't give the model a concrete rule to apply.</p>
<h4>Be specific and categorical</h4>
<p>Instead of "check that comments are accurate," say "flag a comment only when its claimed behavior contradicts the actual code behavior." Define exactly which issues to <i>report</i> (bugs, security) versus <i>skip</i> (minor style, local patterns). Give concrete code examples for each severity level so classification is consistent.</p>
<div class="callout trap"><b>Why it matters:</b> high false-positive categories destroy developer trust — and once people stop trusting one category, they discount the accurate ones too. If a category is noisy, a valid move is to <i>temporarily disable</i> it while you improve its prompt, to restore trust.</div>
<div class="callout check"><b>Self-check:</b> "be more conservative" didn't reduce false positives. Better approach? (Replace it with specific categorical criteria and examples.)</div>
`},

{dom:4,title:'Few-shot prompting',body:`
<p>"Few-shot" means including a handful of worked examples in your prompt. It's the most effective lever when detailed <i>instructions alone</i> still produce inconsistent output.</p>
<h4>What good examples do</h4>
<ul>
<li>Show the exact <b>output format</b> you want (e.g., location, issue, severity, suggested fix) so results come out consistent.</li>
<li>Demonstrate <b>ambiguous-case handling</b> — include 2–4 examples that show the <i>reasoning</i> for why one action was chosen over a plausible alternative.</li>
<li>Enable <b>generalization</b> — done well, examples teach judgment that transfers to novel patterns, not just the exact cases shown.</li>
<li>Reduce <b>hallucination</b> in extraction — show correct handling of varied document structures (inline citations vs bibliographies, etc.).</li>
</ul>
<div class="callout check"><b>Self-check:</b> your instructions are detailed but output is still inconsistent in tricky cases. Highest-leverage addition? (2–4 few-shot examples showing reasoning for ambiguous cases.)</div>
`},

{dom:4,title:'Structured output via tool_use',body:`
<p>When you need reliable, machine-readable output (not prose), the most reliable approach is <b>tool use with a JSON schema</b>. You define a "tool" whose input is your desired data shape; Claude fills it in; you read the structured result. This <b>eliminates JSON syntax errors</b> entirely.</p>
<div class="callout trap"><b>Critical limit:</b> a strict schema removes <i>syntax</i> errors but does <b>not</b> prevent <i>semantic</i> errors — line items that don't sum to the total, or a value placed in the wrong field. The JSON is valid; the meaning can still be wrong.</div>
<p>Recall the <code>tool_choice</code> options here too: <code>"auto"</code> (may return text), <code>"any"</code> (must call some tool), forced (must call a specific tool). To <i>guarantee</i> structured output when several extraction schemas exist and you don't know the document type, set <code>tool_choice: "any"</code>.</p>
<div class="callout check"><b>Self-check:</b> your extracted invoices are valid JSON but the line items don't add up to the total. Does a stricter schema fix this? (No — that's a semantic error; add a calculated_total vs stated_total check.)</div>
`},

{dom:4,title:'Designing good schemas',body:`
<p>A schema is the shape of your structured data. A few design choices come up repeatedly.</p>
<ul>
<li><b>Required vs optional fields</b> — mark a field optional when the source document might not contain it.</li>
<li><b>Nullable fields</b> — make fields nullable so the model can return <code>null</code> for missing info <i>instead of fabricating a value</i> to satisfy a "required" field. This is the main defense against hallucinated data.</li>
<li><b>Extensible categories</b> — use an enum plus an <code>"other"</code> value with a detail string, and an <code>"unclear"</code> value for ambiguous cases. That way the model isn't forced to jam a novel case into a wrong bucket.</li>
</ul>
<div class="callout"><b>Pair with prompts:</b> include format-normalization rules in the prompt alongside the strict schema, so inconsistent source formatting still maps cleanly.</div>
<div class="callout check"><b>Self-check:</b> the model invents a value when a field is absent from the document. Schema fix? (Make the field nullable/optional so it can return null.)</div>
`},

{dom:4,title:'Validation and retry loops',body:`
<p>Even with schemas, extractions sometimes fail validation. A good recovery is <b>retry-with-error-feedback</b>: on the retry, send the original document, the failed extraction, <i>and</i> the specific validation error, so the model can self-correct.</p>
<div class="callout trap"><b>Know retry's limit:</b> retries help with format mismatches and structural errors. They do <b>not</b> help when the required information is simply <i>absent</i> from the source — re-asking won't conjure data that isn't there.</div>
<h4>Designing for analysis</h4>
<p>Add fields like <code>detected_pattern</code> to your structured findings so you can later analyze <i>which code constructs</i> trigger false positives when developers dismiss findings. For reconciliation, extract <code>calculated_total</code> alongside <code>stated_total</code> to flag discrepancies, and add a <code>conflict_detected</code> boolean for inconsistent source data.</p>
<div class="callout check"><b>Self-check:</b> retries keep failing on a field. Before retrying again, what should you check? (Whether that info even exists in the source — if absent, retrying is futile.)</div>
`},

{dom:4,title:'Batch processing',body:`
<p>The <b>Message Batches API</b> processes many requests asynchronously. The tradeoffs define when to use it:</p>
<ul>
<li>~<b>50% cost savings</b>.</li>
<li>Up to a <b>24-hour</b> processing window, with <b>no guaranteed latency SLA</b>.</li>
<li><b>No multi-turn tool calling</b> within a single request — it can't run tools mid-request and continue.</li>
<li><code>custom_id</code> fields correlate each request with its response.</li>
</ul>
<div class="callout trap"><b>The matching rule:</b> batch is right for <i>non-blocking, latency-tolerant</i> work — overnight reports, weekly audits, nightly test generation. It's <i>wrong</i> for <i>blocking</i> work like a pre-merge check where a developer is waiting. Match the API to the workflow: synchronous for blocking, batch for overnight.</div>
<p>Handle failures by resubmitting only the failed items (found via <code>custom_id</code>), e.g., chunking documents that exceeded context limits. And refine your prompt on a small sample before batching huge volumes, to maximize first-pass success.</p>
<div class="callout check"><b>Self-check:</b> a manager wants to move a blocking pre-merge check to batch for the cost savings. Good idea? (No — blocking work needs synchronous; use batch only for the overnight report.)</div>
`},

{dom:4,title:'Multi-pass and independent review',body:`
<p>Two reliability ideas for reviews.</p>
<h4>Independent review beats self-review</h4>
<p>A model that just generated code <i>keeps its own reasoning</i> and is unlikely to question its decisions in the same session — even with "think harder" instructions. A <b>separate, independent instance</b>, with no prior reasoning context, catches subtle issues much better.</p>
<h4>Multi-pass to avoid attention dilution</h4>
<p>For large reviews, split into <b>per-file local passes</b> (issues within a file) plus a <b>cross-file integration pass</b> (data flow across files). Looking at everything at once causes shallow, inconsistent, even contradictory findings.</p>
<div class="callout trap"><b>Tempting wrong answer:</b> "run three passes and only flag issues that appear in at least two." That <i>suppresses</i> real bugs that are only caught intermittently. More context window also doesn't fix attention quality.</div>
<div class="callout check"><b>Self-check:</b> a single pass over 14 files gives inconsistent, contradictory feedback. Restructure how? (Per-file passes + a separate cross-file integration pass.)</div>
`},

{dom:5,title:'Preserving context over long conversations',body:`
<p>Long sessions strain the context window, and naive fixes lose critical facts.</p>
<div class="callout trap"><b>Progressive summarization risk:</b> repeatedly summarizing the conversation condenses exact numbers, percentages, dates, and stated expectations into vague text — exactly the details you can't afford to lose.</div>
<p>There's also the <b>"lost in the middle"</b> effect: models reliably use information at the <i>beginning</i> and <i>end</i> of a long input but may overlook things buried in the middle.</p>
<h4>Techniques</h4>
<ul>
<li>Keep a persistent <b>"case facts" block</b> (amounts, dates, order numbers, statuses) included in <i>every</i> prompt, kept <i>outside</i> the summarized history so it never gets blurred.</li>
<li><b>Trim verbose tool outputs</b> to only the relevant fields before they pile up (an order lookup might return 40+ fields when 5 matter).</li>
<li>Place <b>key findings at the start</b> of aggregated inputs and use clear section headers to fight position effects.</li>
</ul>
<div class="callout check"><b>Self-check:</b> after a long support chat, the agent forgets the exact refund amount. What design prevents this? (A persistent case-facts block outside the summarized history.)</div>
`},

{dom:5,title:'Escalation and ambiguity',body:`
<p>Knowing <i>when</i> an agent should hand off to a human is a reliability skill.</p>
<h4>Valid escalation triggers</h4>
<ul>
<li>The customer <b>explicitly asks for a human</b> — escalate immediately, don't first try to investigate.</li>
<li>A <b>policy gap or exception</b> — the policy is silent or ambiguous on this case (e.g., competitor price-matching when policy only covers your own site).</li>
<li><b>Inability to make meaningful progress.</b></li>
</ul>
<div class="callout trap"><b>Bad signals:</b> customer <i>sentiment</i> and the model's <i>self-reported confidence</i> are unreliable proxies for actual case complexity — the agent can be confidently wrong on hard cases. Don't escalate based on those. Use explicit criteria with few-shot examples instead.</div>
<p>When tool results return <b>multiple customer matches</b>, don't guess with a heuristic — ask for an additional identifier to disambiguate.</p>
<div class="callout check"><b>Self-check:</b> a customer is calm but explicitly says "I want a human." Investigate first or escalate? (Escalate immediately — honor the explicit request.)</div>
`},

{dom:5,title:'Propagating errors across agents',body:`
<p>In a multi-agent system, when a subagent fails, the <i>way</i> the failure travels back to the coordinator decides whether recovery is possible.</p>
<h4>Return structured error context</h4>
<p>Include the <b>failure type</b>, the <b>attempted query</b>, any <b>partial results</b>, and <b>potential alternatives</b>. With that, the coordinator can intelligently decide: retry with a modified query, try a different approach, or proceed with what it has.</p>
<div class="callout trap"><b>Three anti-patterns:</b> (1) generic statuses like "search unavailable" that hide useful context; (2) <i>silently suppressing</i> errors by returning empty results marked as success; (3) <i>terminating the entire workflow</i> on a single subagent failure. Also keep distinguishing access failures (might retry) from valid empty results.</div>
<p>Good design: subagents recover locally from transient issues and only propagate what they truly can't resolve — including what they attempted and any partial results. Synthesis output should annotate which findings are well-supported vs. which topics have gaps from unavailable sources.</p>
<div class="callout check"><b>Self-check:</b> a search subagent times out. Best thing to send the coordinator? (Structured error context: type, attempted query, partial results, alternatives.)</div>
`},

{dom:5,title:'Context in large codebase exploration',body:`
<p>Exploring a big codebase in one long session degrades over time: the model starts giving inconsistent answers and referencing <i>"typical patterns"</i> instead of the specific classes it discovered earlier. Several techniques counteract this.</p>
<ul>
<li><b>Scratchpad files</b> — have agents record key findings to a file and re-read them for later questions, so knowledge survives across context boundaries.</li>
<li><b>Subagent delegation</b> — send verbose exploration to a subagent (e.g., "find all test files," "trace the refund-flow dependencies") while the main agent keeps a clean, high-level view.</li>
<li><b><code>/compact</code></b> — reduce context usage when it fills with verbose discovery output.</li>
<li><b>Structured state manifests</b> — each agent exports its state to a known location; on resume, the coordinator loads a manifest for crash recovery.</li>
</ul>
<div class="callout"><b>Pattern:</b> summarize key findings from one exploration phase <i>before</i> spawning subagents for the next, injecting that summary into their initial context.</div>
<div class="callout check"><b>Self-check:</b> deep into a session, the agent stops citing real classes and talks about "typical" ones. What's happening, and one fix? (Context degradation — use scratchpad files / subagent delegation / /compact.)</div>
`},

{dom:5,title:'Human review and confidence calibration',body:`
<p>Before you reduce human review of an automated system, you have to trust the accuracy — carefully.</p>
<div class="callout trap"><b>The averaging trap:</b> a headline "97% accurate" can hide poor performance on a <i>specific</i> document type or field. Aggregate metrics mask weak segments.</div>
<h4>Do it properly</h4>
<ul>
<li><b>Analyze accuracy by document type and field</b> to confirm consistent performance across all segments before automating.</li>
<li><b>Stratified random sampling</b> of high-confidence extractions for ongoing error-rate measurement and to catch novel error patterns.</li>
<li><b>Field-level confidence scores</b>, calibrated using labeled validation sets, to route review attention.</li>
<li>Send low-confidence or ambiguous/contradictory cases to <b>human review</b>, prioritizing limited reviewer capacity.</li>
</ul>
<div class="callout check"><b>Self-check:</b> overall accuracy is 97%, but should you fully automate? (Not yet — check accuracy <i>by type and field</i>; the average can hide a weak segment.)</div>
`},

{dom:5,title:'Provenance and uncertainty in synthesis',body:`
<p>When combining findings from many sources, you must preserve <i>where each claim came from</i> and handle disagreement honestly.</p>
<ul>
<li><b>Claim-source mappings</b> — subagents output structured mappings (source URL, document name, relevant excerpt) that the synthesis agent must <i>preserve and merge</i>, not flatten away. Summarization that drops these loses attribution.</li>
<li><b>Conflicting statistics</b> — when credible sources disagree, <i>annotate the conflict with source attribution</i> rather than arbitrarily picking one value.</li>
<li><b>Temporal data</b> — require publication/collection dates in structured outputs, so a difference caused by <i>time</i> isn't misread as a contradiction.</li>
</ul>
<div class="callout"><b>Presentation:</b> structure reports to distinguish well-established findings from contested ones, and render content types appropriately — financial data as tables, news as prose, technical findings as lists — instead of forcing everything into one format.</div>
<div class="callout check"><b>Self-check:</b> two reputable sources report different market sizes. What should synthesis do? (Keep both, annotated with source and date — don't silently pick one.)</div>
`}
];

/* ---------------- STATE ---------------- */
const LS='cca_learn_v2';
let state=JSON.parse(localStorage.getItem(LS)||'{}');
state.doneLessons=state.doneLessons||{};
state.current=(state.current==null?0:state.current);
state.known=state.known||{};
state.bestQuiz=state.bestQuiz!==undefined?state.bestQuiz:null;
state.qa=state.qa||{}; // lessonIndex -> [{q,a}]
state.lqAnswers=state.lqAnswers||{}; // lessonIndex -> {qIdx:chosen}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

/* ---------------- TABS ---------------- */
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');document.getElementById(t.dataset.p).classList.add('active');
};});

/* ---------------- LEARN ---------------- */
let learnView='landing'; // 'landing' | 'lesson'
function firstUndone(){for(let i=0;i<LESSONS.length;i++)if(!state.doneLessons[i])return i;return LESSONS.length-1;}
function renderLearn(){
  const c=document.getElementById('learn');
  if(learnView==='landing'){ renderLanding(c); } else { renderLesson(c); }
  updateOverall();
}
function renderLanding(c){
  const next=firstUndone();
  const L=LESSONS[next];
  const doneCount=Object.keys(state.doneLessons).length;
  const allDone=doneCount>=LESSONS.length;
  c.innerHTML=`<div class="card landing">
    <div class="big">📘</div>
    <h2>${allDone?'You’ve finished every lesson! 🎉':'Ready for today’s topic?'}</h2>
    <div class="next">${allDone?'Revisit any lesson below, or test yourself in the Quiz tab.':'Up next — Lesson '+(next+1)+' of '+LESSONS.length+': <b>'+L.title+'</b> '+domPill(L.dom)}</div>
    <button class="bigbtn" onclick="openLesson(${next})">${allDone?'Review a lesson':'Let’s learn today →'}</button>
    <div class="lessonlist">${lessonDropdown(next)}</div>
  </div>`;
  wireDropdown(c);
}
function domPill(d){return d===0?'':'<span class="dom-pill" style="background:'+DOMC[d]+'">Domain '+d+'</span>';}
function lessonDropdown(sel){
  let opts=LESSONS.map((L,i)=>`<option value="${i}" ${i===sel?'selected':''}>${state.doneLessons[i]?'✓ ':''}Lesson ${i+1}: ${L.title}</option>`).join('');
  return `<select id="lessonJump"><option disabled>Jump to any lesson…</option>${opts}</select>`;
}
function wireDropdown(c){const s=c.querySelector('#lessonJump'); if(s) s.onchange=()=>openLesson(+s.value);}
function openLesson(i){state.current=i;save();learnView='lesson';renderLearn();window.scrollTo({top:0,behavior:'smooth'});}
function renderLesson(c){
  const i=state.current, L=LESSONS[i], done=!!state.doneLessons[i];
  const qa=state.qa[i]||[];
  c.innerHTML=`
  <div class="card">
    <div class="lesson-head">
      ${domPill(L.dom)}
      <span class="lcount">Lesson ${i+1} of ${LESSONS.length}${done?' · <span class="donetag">completed ✓</span>':''}</span>
    </div>
    <h2 style="margin:6px 0 2px">${L.title}</h2>
    <div class="lesson-body">${L.body}</div>

    ${renderLessonQuiz(i)}

    <div class="ask">
      <h4>Ask a question about this lesson</h4>
      <textarea id="askInput" placeholder="e.g. Can you give another example of a PostToolUse hook?"></textarea>
      <div class="row">
        ${suggestChips(L)}
      </div>
      <div class="row">
        <button class="btn primary" id="askBtn" onclick="askQuestion()">Ask</button>
      </div>
      <div class="qa" id="qaList">${qa.map(p=>qaRow(p.q,p.a)).join('')}</div>
    </div>

    <div class="lesson-foot">
      <div>
        <button class="btn ghost" onclick="goLanding()">← All lessons</button>
        ${done?`<button class="btn ghost" onclick="markIncomplete()">↺ Mark incomplete</button>`:''}
      </div>
      <div>
        <button class="btn" onclick="prevLesson()" ${i===0?'disabled':''}>Previous</button>
        <button class="btn primary" onclick="completeAndNext()">${done?(i<LESSONS.length-1?'Next lesson →':'Back to start'):'Mark complete & next →'}</button>
      </div>
    </div>
  </div>`;
  wireDropAfter(c);
  applyLqState(i);
}
function renderLessonQuiz(i){
  const qs=LESSONQUIZ[i]||[]; if(!qs.length) return '';
  let html='<div class="lq"><h4>Check your understanding</h4><div class="lq-sub">Answer to see if it sticks — instant feedback below each option.</div>';
  qs.forEach((q,qi)=>{
    html+=`<div class="lq-q"><div class="lq-text">${qi+1}. ${q.q}</div><div id="lqo-${i}-${qi}">`;
    q.o.forEach((o,oi)=>{ html+=`<div class="opt" id="lq-${i}-${qi}-${oi}" onclick="lqChoose(${i},${qi},${oi})"><span class="lk">${'ABCD'[oi]}.</span>${o}</div>`; });
    html+=`</div><div class="explain" id="lqex-${i}-${qi}"><b>${q.ans!=null?'Answer: '+'ABCD'[q.ans]+'. ':''}</b>${q.ex}</div></div>`;
  });
  html+=`<div class="lq-score" id="lqscore-${i}"></div>`;
  html+=`<div style="margin-top:10px"><button class="btn ghost" onclick="retakeLq(${i})">↻ Retake quiz</button></div></div>`;
  return html;
}
function retakeLq(i){ delete state.lqAnswers[i]; save(); renderLearn(); }
function lqChoose(i,qi,oi){
  state.lqAnswers[i]=state.lqAnswers[i]||{};
  if(state.lqAnswers[i][qi]!==undefined) return; // lock after first answer
  state.lqAnswers[i][qi]=oi; save();
  revealLq(i,qi); updateLqScore(i);
}
function revealLq(i,qi){
  const q=LESSONQUIZ[i][qi]; const chosen=state.lqAnswers[i][qi];
  const box=document.getElementById('lqo-'+i+'-'+qi); if(!box) return;
  q.o.forEach((o,oi)=>{ const el=document.getElementById('lq-'+i+'-'+qi+'-'+oi);
    el.classList.add('locked');
    if(oi===q.ans) el.classList.add('correct'); else if(oi===chosen) el.classList.add('wrong');
  });
  const ex=document.getElementById('lqex-'+i+'-'+qi); if(ex) ex.classList.add('show');
}
function updateLqScore(i){
  const qs=LESSONQUIZ[i]||[]; const ans=state.lqAnswers[i]||{};
  const answered=Object.keys(ans).length; if(answered<qs.length) return;
  let correct=0; qs.forEach((q,qi)=>{ if(ans[qi]===q.ans) correct++; });
  const el=document.getElementById('lqscore-'+i); if(!el) return;
  const pass=correct===qs.length;
  el.className='lq-score '+(pass?'pass':'fail');
  el.textContent = pass ? `Perfect — ${correct}/${qs.length}. You’ve got this topic.` : `${correct}/${qs.length}. Re-read the highlighted parts above, then move on.`;
}
function applyLqState(i){
  const ans=state.lqAnswers[i]||{};
  Object.keys(ans).forEach(qi=>revealLq(i,+qi));
  updateLqScore(i);
}
function markIncomplete(){
  const i=state.current; delete state.doneLessons[i]; save(); renderLearn();
}
function suggestChips(L){
  const chips=['Explain this more simply','Give me a real example','How might the exam test this?','What’s the most common mistake?'];
  return chips.map(t=>`<button class="suggest" onclick="setAsk('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');
}
function setAsk(t){const el=document.getElementById('askInput'); if(el){el.value=t; el.focus();}}
function qaRow(q,a){return `<div class="qarow"><div class="qq">Q: ${escapeHtml(q)}</div><div class="aa">${a}</div></div>`;}
function escapeHtml(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function wireDropAfter(c){}
async function askQuestion(){
  const i=state.current, L=LESSONS[i];
  const el=document.getElementById('askInput');
  const q=(el.value||'').trim(); if(!q) return;
  const btn=document.getElementById('askBtn'); btn.disabled=true; btn.textContent='Thinking…';
  const list=document.getElementById('qaList');
  const pending=document.createElement('div'); pending.className='qarow';
  pending.innerHTML=`<div class="qq">Q: ${escapeHtml(q)}</div><div class="aa pending">thinking…</div>`;
  list.appendChild(pending);
  const plain=L.body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const prompt=`You are a warm, patient tutor helping a beginner study for the Claude Certified Architect – Foundations exam. `+
    `The current lesson is titled "${L.title}" (exam domain ${L.dom||'overview'}). Lesson content:\n"""${plain}"""\n\n`+
    `The student asks: "${q}"\n\nAnswer clearly and simply for a beginner. Be concise (a short paragraph, or a few short points). `+
    `Stay accurate to how Claude Agent SDK, Claude Code, MCP, and the Claude API actually work. If the question is outside this lesson, answer briefly and gently point back to the relevant idea.`;
  let answer='';
  try{
    if(window.cowork && window.cowork.askClaude){
      const r=await window.cowork.askClaude(prompt,[]);
      answer = typeof r==='string'? r : (r && (r.text||r.answer||r.content||r.message)) || '';
      if(typeof answer!=='string') answer=JSON.stringify(answer);
    } else if(CHAT_PROXY_URL){
      const resp=await fetch(CHAT_PROXY_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt})});
      const data=await resp.json().catch(()=>({}));
      if(!resp.ok) throw new Error((data&&data.error)||('HTTP '+resp.status));
      answer=(data.text||'').toString().trim();
    } else {
      answer='This chat needs a backend when hosted. Set CHAT_PROXY_URL near the top of the file to your Cloudflare Worker URL (see the setup notes), or open the app inside Cowork.';
    }
    if(!answer) answer='(No answer returned. Try rephrasing your question.)';
  }catch(e){
    answer='I couldn’t reach the assistant. Check that your backend proxy URL is correct and the Worker is deployed. (Details: '+escapeHtml(String(e.message||e))+')';
  }
  answer = escapeHtml(answer).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
  state.qa[i]=state.qa[i]||[]; state.qa[i].push({q,a:answer}); save();
  pending.querySelector('.aa').classList.remove('pending');
  pending.querySelector('.aa').innerHTML=answer;
  el.value=''; btn.disabled=false; btn.textContent='Ask';
}
function goLanding(){learnView='landing';renderLearn();window.scrollTo({top:0,behavior:'smooth'});}
function prevLesson(){if(state.current>0){state.current--;save();renderLearn();window.scrollTo({top:0,behavior:'smooth'});}}
function completeAndNext(){
  const i=state.current;
  state.doneLessons[i]=true; save();
  if(i<LESSONS.length-1){state.current=i+1;save();renderLearn();}
  else{learnView='landing';renderLearn();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateOverall(){
  const total=LESSONS.length, done=Object.keys(state.doneLessons).length;
  document.getElementById('overallbar').style.width=(done/total*100)+'%';
  document.getElementById('overalllabel').textContent=`${done} of ${total} lessons complete`;
}

/* ---------------- FLASHCARDS ---------------- */
let fcList=[],fcIdx=0,fcFlipped=false;
function buildFcDomainSelect(){const sel=document.getElementById('fcDomain');
  sel.innerHTML='<option value="0">All domains</option>'+[1,2,3,4,5].map(d=>`<option value="${d}">Domain ${d} — ${DOMNAME[d]}</option>`).join('');
  sel.onchange=()=>loadFc(+sel.value);}
function loadFc(dom){fcList=FLASHCARDS.map((f,i)=>({...f,gi:i})).filter(f=>dom===0||f.dom===dom);fcIdx=0;fcFlipped=false;renderFc();}
function renderFc(){if(!fcList.length)return;const f=fcList[fcIdx];
  document.getElementById('fcSide').textContent=fcFlipped?'Answer':'Question';
  const b=document.getElementById('fcBody');b.className=fcFlipped?'a':'q';b.innerHTML=fcFlipped?f.a:f.q;
  document.getElementById('fcPos').textContent=`Card ${fcIdx+1} / ${fcList.length} · Domain ${f.dom}`;
  const known=!!state.known[f.gi];const kb=document.getElementById('knownBtn');
  kb.textContent=known?'Known ✓':'Mark known';kb.style.background=known?'var(--okbg)':'';kb.style.borderColor=known?'var(--ok)':'';
  document.getElementById('fcKnown').textContent=`${Object.keys(state.known).length} / ${FLASHCARDS.length} marked known`;}
function flipCard(){fcFlipped=!fcFlipped;renderFc();}
function nextCard(){fcIdx=(fcIdx+1)%fcList.length;fcFlipped=false;renderFc();}
function prevCard(){fcIdx=(fcIdx-1+fcList.length)%fcList.length;fcFlipped=false;renderFc();}
function markKnown(){const gi=fcList[fcIdx].gi;if(state.known[gi])delete state.known[gi];else state.known[gi]=true;save();renderFc();}

/* ---------------- QUIZ ---------------- */
let quizAnswers={};
function renderQuiz(){const c=document.getElementById('quiz');c.innerHTML='';
  const head=document.createElement('div');head.className='card';
  head.innerHTML=`<b>Practice Quiz</b> — ${QUIZ.length} scenario questions. Pick an answer to see the explanation.${state.bestQuiz!=null?` <div class="score">Best score: ${state.bestQuiz}%</div>`:''}`;
  c.appendChild(head);
  const letters=['A','B','C','D'];
  QUIZ.forEach((q,i)=>{const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div class="q-scenario">Scenario: ${q.sc} · Domain ${q.dom}</div><div class="q-text">Q${i+1}. ${q.q}</div><div id="opts-${i}"></div><div class="explain" id="ex-${i}"><b>Answer: ${letters[q.ans]}.</b> ${q.ex}</div>`;
    c.appendChild(card);const od=card.querySelector('#opts-'+i);
    q.o.forEach((opt,j)=>{const b=document.createElement('div');b.className='opt';b.innerHTML=`<span class="lk">${letters[j]}.</span>${opt}`;b.onclick=()=>chooseOpt(i,j);od.appendChild(b);});});
  const foot=document.createElement('div');foot.className='card quiz-foot';
  foot.innerHTML=`<span class="score" id="quizScore">Answered 0 / ${QUIZ.length}</span><button class="btn primary" onclick="scoreQuiz()">Score quiz</button>`;
  c.appendChild(foot);const res=document.createElement('div');res.id='quizResult';c.appendChild(res);}
function chooseOpt(i,j){quizAnswers[i]=j;const q=QUIZ[i];const opts=document.querySelectorAll('#opts-'+i+' .opt');
  opts.forEach((o,k)=>{o.classList.remove('correct','wrong');if(k===q.ans)o.classList.add('correct');else if(k===j)o.classList.add('wrong');});
  document.getElementById('ex-'+i).classList.add('show');
  document.getElementById('quizScore').textContent=`Answered ${Object.keys(quizAnswers).length} / ${QUIZ.length}`;}
function scoreQuiz(){let correct=0;QUIZ.forEach((q,i)=>{if(quizAnswers[i]===q.ans)correct++;});
  const pct=Math.round(correct/QUIZ.length*100);if(state.bestQuiz==null||pct>state.bestQuiz){state.bestQuiz=pct;save();}
  const pass=pct>=72;const r=document.getElementById('quizResult');r.className='card resultbox';
  r.innerHTML=`<div class="big ${pass?'pass':'fail'}">${pct}%</div><div>${correct} of ${QUIZ.length} correct</div><div class="score">${pass?'Above the 72% line — keep drilling weak domains.':'Below 72% — review the explanations and the Reference tab, then retry.'}</div>`;
  r.scrollIntoView({behavior:'smooth',block:'center'});}

/* ---------------- REFERENCE ---------------- */
function renderRef(){const c=document.getElementById('ref');c.innerHTML='';
  const intro=document.createElement('div');intro.className='note';
  intro.innerHTML='Condensed cheat-sheet of all 5 domains and task statements. Weight shown in the pill.';c.appendChild(intro);
  REFERENCE.forEach(sec=>{const h=document.createElement('h3');
    h.innerHTML=`Domain ${sec.dom}: ${DOMNAME[sec.dom]}<span class="wt" style="background:${DOMC[sec.dom]}">${DOMWT[sec.dom]}</span>`;c.appendChild(h);
    const ul=document.createElement('ul');sec.items.forEach(it=>{const li=document.createElement('li');li.innerHTML=`<span class="ts">${it[0]}:</span> ${it[1]}`;ul.appendChild(li);});c.appendChild(ul);});}

/* ---------------- RESET ---------------- */
function resetAll(){if(confirm('Reset all progress (lessons, Q&A, flashcards, quiz)?')){
  state={doneLessons:{},current:0,known:{},bestQuiz:null,qa:{},lqAnswers:{}};save();
  learnView='landing';renderLearn();loadFc(+document.getElementById('fcDomain').value);renderQuiz();}}

/* ---------------- INIT ---------------- */
renderLearn();buildFcDomainSelect();loadFc(0);renderQuiz();renderRef();
</script>
</body>
